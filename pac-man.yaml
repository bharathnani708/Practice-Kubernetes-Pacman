# 00-namespace
apiVersion: v1
kind: Namespace
metadata:
  name: pacman
---
# 01-persistent-volume-claim for MongoDB (stores high scores)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-storage
  namespace: pacman
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# 02-mongo (Stateful-ish via PVC; simple/no-auth for tutorial)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: pacman
  labels: { app: mongo }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: mongo-db
              mountPath: /data/db
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "300m", memory: "512Mi" }
          readinessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: mongo-db
          persistentVolumeClaim:
            claimName: mongo-storage
---
# 03-mongo Service (stable DNS: mongo.pacman.svc)
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: pacman
  labels: { app: mongo }
spec:
  type: ClusterIP
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  selector:
    app: mongo
---
# 04-pacman front-end (2 replicas for HA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pacman
  namespace: pacman
  labels: { app: pacman }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pacman }
  template:
    metadata:
      labels: { app: pacman }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: pacman }
      containers:
        - name: pacman
          # Community-built Node.js frontend image (swap with your own if you build it)
          image: lamw/pacman-nodejs-app:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # The app resolves "mongo" via K8s DNS by default
            - name: MONGO_SERVICE_HOST
              value: "mongo"
            - name: MONGO_SERVICE_PORT
              value: "27017"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: "/", port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: "/", port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
# 05-pacman Service (NodePort for easy local access; switch to LoadBalancer in cloud)
apiVersion: v1
kind: Service
metadata:
  name: pacman
  namespace: pacman
  labels: { app: pacman }
spec:
  type: NodePort
  selector:
    app: pacman
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
# 06-HPA (autoscale Pac-Man between 2 and 5 pods at ~60% CPU)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pacman
  namespace: pacman
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pacman
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
# 07-PDB (maintain at least 1 pacman pod during voluntary disruptions)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pacman-pdb
  namespace: pacman
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: pacman }
